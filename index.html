<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Miss You Pappa</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            font-family: Arial, sans-serif;
        }
        .card {
            text-align: center;
            padding: 50px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin: 20px;
        }
        .emojis {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        h1 {
            color: #38bdf8;
            font-size: 3rem;
            margin: 0 0 15px 0;
        }
        p {
            color: #94a3b8;
            font-size: 1.25rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emojis">🥹 🫂</div>
        <h1>I Miss You, Pappa</h1>
        <p>Always in my thoughts and heart.</p>
    </div>
</body>
</html>
